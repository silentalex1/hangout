<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Chatting Hangout Admin Panel">
    <title>Chatting Hangout - Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(145deg, #2e2a47, #4a5e6d);
            color: #e0e0e0;
            min-height: 100vh;
        }
        body.light-mode {
            background: linear-gradient(145deg, #f0f0f5, #d9e4e6);
            color: #2e2a47;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .logo {
            display: flex;
            align-items: center;
        }
        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #6b5b95, #88b7b5);
            border-radius: 10px;
            margin-right: 0.8rem;
            position: relative;
        }
        .logo-icon::before {
            content: 'C';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-weight: bold;
            font-size: 1.5rem;
            color: #2e2a47;
        }
        header h1 {
            font-size: 1.8rem;
            color: #6b5b95;
        }
        .light-mode header h1 {
            color: #4a5e6d;
        }
        .back-btn {
            background: #ff4d4d;
            color: #fff;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
        }
        .back-btn:hover {
            background: #ff6666;
        }
        .section {
            background: rgba(255, 255, 255, 0.05);
            padding: 1.5rem;
            border-radius: 15px;
            margin-bottom: 1rem;
            backdrop-filter: blur(5px);
        }
        .light-mode .section {
            background: rgba(0, 0, 0, 0.05);
        }
        .section h2 {
            color: #6b5b95;
            font-size: 1.8rem;
            margin-bottom: 1rem;
        }
        .light-mode .section h2 {
            color: #4a5e6d;
        }
        .user-list {
            list-style: none;
            padding: 0;
        }
        .user-list li {
            padding: 0.5rem 1rem;
            margin-bottom: 0.5rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .light-mode .user-list li {
            background: rgba(0, 0, 0, 0.05);
        }
        .ban-btn, .change-password-btn, .change-code-btn, .promote-btn {
            background: #ff4d4d;
            color: #fff;
            border: none;
            padding: 0.3rem 0.8rem;
            border-radius: 8px;
            cursor: pointer;
        }
        .ban-btn:hover, .change-password-btn:hover, .change-code-btn:hover, .promote-btn:hover {
            background: #ff6666;
        }
        .change-password-btn, .change-code-btn, .promote-btn {
            background: #6b5b95;
        }
        .change-password-btn:hover, .change-code-btn:hover, .promote-btn:hover {
            background: #88b7b5;
        }
        .global-code-form {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        .global-code-form input {
            padding: 0.8rem;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
            font-size: 1rem;
            outline: none;
        }
        .light-mode .global-code-form input {
            background: rgba(0, 0, 0, 0.1);
            color: #2e2a47;
        }
        .global-code-form button {
            background: #6b5b95;
            color: #fff;
            border: none;
            padding: 0.8rem;
            border-radius: 8px;
            cursor: pointer;
        }
        .global-code-form button:hover {
            background: #88b7b5;
        }
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }
            .user-list li {
                flex-direction: column;
                align-items: flex-start;
            }
            .global-code-form {
                flex-direction: column;
            }
        }
        @media (max-width: 480px) {
            header h1 {
                font-size: 1.5rem;
            }
            .section h2 {
                font-size: 1.5rem;
            }
            .ban-btn, .change-password-btn, .change-code-btn, .promote-btn {
                font-size: 0.9rem;
                padding: 0.3rem 0.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <div class="logo-icon"></div>
                <h1>Admin Panel</h1>
            </div>
            <button class="back-btn" onclick="window.location.href='/lobby'">Back to Lobby</button>
        </header>
        <div class="section">
            <h2>Manage Website Code</h2>
            <div class="global-code-form">
                <input type="text" id="globalCodeInput" placeholder="Set global website code">
                <button onclick="setGlobalCode()">Set Code</button>
            </div>
        </div>
        <div class="section">
            <h2>Manage Users</h2>
            <ul class="user-list" id="userList"></ul>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = localStorage.getItem('username');
            const admins = JSON.parse(localStorage.getItem('admins')) || [];
            const mods = JSON.parse(localStorage.getItem('mods')) || [];
            if (!user || (!admins.includes(user) && !mods.includes(user))) {
                window.location.href = '/lobby';
                return;
            }
            let users = JSON.parse(localStorage.getItem('users')) || [];
            let bannedUsers = JSON.parse(localStorage.getItem('bannedUsers')) || [];
            function renderUsers() {
                const userList = document.getElementById('userList');
                userList.innerHTML = '';
                const fragment = document.createDocumentFragment();
                users.forEach(u => {
                    if (u === user || u === 'realalex') return;
                    const li = document.createElement('li');
                    li.innerHTML = `
                        <span>${u}${admins.includes(u) ? ' (Admin)' : mods.includes(u) ? ' (Mod)' : ''}</span>
                        <div>
                            <button class="ban-btn" onclick="banUser('${u}')">${bannedUsers.includes(u) ? 'Unban' : 'Ban'}</button>
                            <button class="change-password-btn" onclick="changePassword('${u}')">Change Password</button>
                            <button class="change-code-btn" onclick="changeCode('${u}')">Change Code</button>
                            <button class="promote-btn" onclick="promoteUser('${u}')">${mods.includes(u) ? 'Demote' : 'Promote to Mod'}</button>
                        </div>
                    `;
                    fragment.appendChild(li);
                });
                userList.appendChild(fragment);
            }
            window.banUser = function(username) {
                if (bannedUsers.includes(username)) {
                    bannedUsers = bannedUsers.filter(u => u !== username);
                } else {
                    bannedUsers.push(username);
                }
                localStorage.setItem('bannedUsers', JSON.stringify(bannedUsers));
                renderUsers();
            };
            window.changePassword = function(username) {
                const newPassword = prompt(`Enter new password for ${username}:`);
                if (newPassword && newPassword.trim()) {
                    localStorage.setItem(`${username}_password`, newPassword.trim());
                    alert(`Password for ${username} updated successfully!`);
                }
            };
            window.changeCode = function(username) {
                const newCode = prompt(`Enter new code for ${username}:`);
                if (newCode && newCode.trim()) {
                    localStorage.setItem(`${username}_code`, newCode.trim());
                    alert(`Code for ${username} updated successfully!`);
                }
            };
            window.promoteUser = function(username) {
                if (mods.includes(username)) {
                    mods.splice(mods.indexOf(username), 1);
                } else {
                    mods.push(username);
                }
                localStorage.setItem('mods', JSON.stringify(mods));
                renderUsers();
            };
            window.setGlobalCode = function() {
                const globalCode = document.getElementById('globalCodeInput').value.trim();
                if (globalCode) {
                    localStorage.setItem('globalWebsiteCode', globalCode);
                    alert('Global website code updated successfully!');
                } else {
                    localStorage.removeItem('globalWebsiteCode');
                    alert('Global website code removed!');
                }
            };
            if (localStorage.getItem('theme') === 'light') {
                document.body.classList.add('light-mode');
            }
            renderUsers();
            window.addEventListener('storage', (event) => {
                if (event.key === 'users' || event.key === 'bannedUsers' || event.key === 'mods') {
                    users = JSON.parse(localStorage.getItem('users')) || [];
                    bannedUsers = JSON.parse(localStorage.getItem('bannedUsers')) || [];
                    mods = JSON.parse(localStorage.getItem('mods')) || [];
                    renderUsers();
                }
            });
        });
    </script>
</body>
</html>
