<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="the best chatting website hangout for school">
    <title>Chatting Hangout - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(145deg, #2e2a47, #4a5e6d);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        body.light-mode {
            background: linear-gradient(145deg, #f0f0f5, #d9e4e6);
            color: #2e2a47;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
            backdrop-filter: blur(5px);
        }
        .light-mode .container {
            background: rgba(0, 0, 0, 0.05);
        }
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
        }
        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #6b5b95, #88b7b5);
            border-radius: 10px;
            margin-right: 0.8rem;
            position: relative;
        }
        .logo-icon::before {
            content: 'C';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-weight: bold;
            font-size: 1.5rem;
            color: #2e2a47;
        }
        h1 {
            font-size: 1.8rem;
            color: #6b5b95;
            margin-bottom: 1.5rem;
        }
        .light-mode h1 {
            color: #4a5e6d;
        }
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .login-form input {
            padding: 0.8rem;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
            font-size: 1rem;
            outline: none;
            transition: background 0.2s ease;
        }
        .light-mode .login-form input {
            background: rgba(0, 0, 0, 0.1);
            color: #2e2a47;
        }
        .login-form input:focus {
            background: rgba(255, 255, 255, 0.2);
        }
        .login-form button {
            background: linear-gradient(135deg, #6b5b95, #88b7b5);
            color: #fff;
            border: none;
            padding: 0.8rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .login-form button:hover {
            transform: scale(1.02);
        }
        .theme-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1rem;
        }
        .theme-toggle input {
            width: 40px;
            height: 20px;
            appearance: none;
            background: #4a5e6d;
            border-radius: 20px;
            position: relative;
            cursor: pointer;
            outline: none;
        }
        .theme-toggle input:checked {
            background: #6b5b95;
        }
        .theme-toggle input::before {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: left 0.2s ease;
        }
        .theme-toggle input:checked::before {
            left: 22px;
        }
        @media (max-width: 480px) {
            .container {
                padding: 1.5rem;
            }
            h1 {
                font-size: 1.5rem;
            }
            .login-form input, .login-form button {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <div class="logo-icon"></div>
            <h1>Chatting Hangout</h1>
        </div>
        <div class="login-form">
            <input type="text" id="username" placeholder="Username" aria-label="Username">
            <input type="password" id="password" placeholder="Password" aria-label="Password">
            <input type="text" id="code" placeholder="Code" aria-label="Code">
            <button onclick="login()">Login</button>
        </div>
        <div class="theme-toggle">
            <label>Light Mode</label>
            <input type="checkbox" id="themeToggle">
        </div>
    </div>
    <script>
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-mode');
            document.getElementById('themeToggle').checked = true;
        }
        document.getElementById('themeToggle').addEventListener('change', (e) => {
            if (e.target.checked) {
                document.body.classList.add('light-mode');
                localStorage.setItem('theme', 'light');
            } else {
                document.body.classList.remove('light-mode');
                localStorage.setItem('theme', 'dark');
            }
        });
        function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const code = document.getElementById('code').value.trim();
            const bannedUsers = JSON.parse(localStorage.getItem('bannedUsers')) || [];
            const storedCode = localStorage.getItem(`${username}_code`);
            const globalCode = localStorage.getItem('globalWebsiteCode') || '';
            if (bannedUsers.includes(username)) {
                alert('You are banned from Chatting Hangout.');
                return;
            }
            if (username && password && code) {
                if (storedCode && storedCode !== code) {
                    alert('Invalid user code. Please try again.');
                    return;
                }
                if (globalCode && globalCode !== code) {
                    alert('Invalid global website code. Please try again.');
                    return;
                }
                localStorage.setItem('username', username);
                localStorage.setItem('password', password);
                localStorage.setItem(`${username}_code`, code);
                let users = JSON.parse(localStorage.getItem('users')) || [];
                if (!users.includes(username)) {
                    users.push(username);
                    localStorage.setItem('users', JSON.stringify(users));
                }
                window.location.href = '/lobby';
            } else {
                alert('Please enter a username, password, and code.');
            }
        }
        document.getElementById('username').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') login();
        });
        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') login();
        });
        document.getElementById('code').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
